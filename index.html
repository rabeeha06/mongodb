<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>User Login</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Login to your account
            </p>

            <form id="loginForm">

                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>

                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="message"></p>

            <p class="link">
                Don't have an account?
                <a href="register.html">
                    Register
                </a>
            </p>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
